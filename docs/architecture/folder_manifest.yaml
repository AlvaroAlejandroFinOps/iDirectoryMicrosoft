version: 6.0
project_type: "iDirectoryFabric: Universal Base Directory Schema & Governance Architecture for Microsoft Fabric"
created_by: Gravity HyperScale Thinking
manifest:
  01_seed: Semilla de proyecto y memoria técnica (ThinkingSeed Master). ADN arquitectónico del sistema.
  src/core: "Motor central de gobernanza, ruteo determinista y Context Engineering (FWengine)."
  src/fabric: "Clasificador Medallón, validador de esquema base, linter de Capacidad F8 y remediador de código Fabric."
  config: "Políticas canónicas de contexto (context_policy.json) y parámetros de configuración desacoplados."
  schemas: "Contratos formales JSON Schema (Draft-07) para validación de beacons, satélite, AST y bus federado."
  docs/architecture: "Manifiestos del esquema de directorio base, topologías C4 y flujos de las capas Medallón."
  docs/specs: "Especificaciones técnicas detalladas, contratos de integración Git y gobernanza v6.0."
  docs/notes: "Bitácoras de ingeniería, registro de deuda técnica y decisiones de arquitectura (ADRs)."
  artifacts/plans/active: "Planes de capacidad y ejecución activos (status: approved | executing)."
  artifacts/plans/metricsthinking: "Evaluación forense de métricas de madurez del proyecto (MetricsThinking™)."
  artifacts/plans/backlog: "Cola formal de intenciones y backlog de planes (crawl: false)."
  artifacts/plans/archive: "Histórico de planes completados o descartados preservados por trazabilidad (crawl: false)."
  scripts: "Scripts operativos y automatización de reportes de benchmarking."
  tests: "Suites de pruebas unitarias, validación del esquema Fabric y presupuestos de tokens."
  tools: "Herramientas de compilación y distribución del runtime iContext."
  .context: "Directorio de telemetría, caché AST, bus federado y mapa satelital (.context/tree.json)."
  fabric_workspaces: "Raíz del esquema de directorio base multi-workspace para Microsoft Fabric Git Integration."
  fabric_workspaces/ws_core_governance/environments: "Contenedor base para artefactos *.Environment (Spark pools y runtime)."
  fabric_workspaces/ws_core_governance/libraries: "Contenedor base para librerías compartidas (.py, .whl) para PySpark."
  fabric_workspaces/ws_core_governance/notebooks: "Contenedor base para *.Notebook transversales de mantenimiento Delta (OPTIMIZE/VACUUM)."
  fabric_workspaces/ws_bronze_ingest/lakehouses: "Contenedor base para referencias *.Lakehouse Bronze y OneLake Shortcuts."
  fabric_workspaces/ws_bronze_ingest/pipelines: "Contenedor base para *.DataPipeline y *.CopyJob de ingesta cruda."
  fabric_workspaces/ws_bronze_ingest/dataflows: "Contenedor base para *.Dataflow Gen2 de extracción ligera."
  fabric_workspaces/ws_bronze_ingest/eventstreams: "Contenedor base para *.Eventstream, *.MirroredDatabase y *.KQLDatabase."
  fabric_workspaces/ws_bronze_ingest/notebooks: "Contenedor base para *.Notebook de ingesta desde APIs o fuentes complejas."
  fabric_workspaces/ws_silver_transform/lakehouses: "Contenedor base para referencias *.Lakehouse Silver (tablas Delta conformadas)."
  fabric_workspaces/ws_silver_transform/notebooks: "Contenedor base para *.Notebook PySpark/SQL de limpieza, deduplicación y SCD2."
  fabric_workspaces/ws_silver_transform/pipelines: "Contenedor base para *.DataPipeline de orquestación de capa Silver."
  fabric_workspaces/ws_gold_analytics/lakehouses: "Contenedor base para referencias *.Lakehouse Gold con V-Order para Direct Lake."
  fabric_workspaces/ws_gold_analytics/warehouses: "Contenedor base para *.Warehouse y *.SQLDatabase (DDL T-SQL, Vistas, SPs)."
  fabric_workspaces/ws_gold_analytics/notebooks: "Contenedor base para *.Notebook de modelado dimensional Kimball (Star Schema)."
  fabric_workspaces/ws_gold_analytics/pipelines: "Contenedor base para *.DataPipeline de refresco analítico Gold."
  fabric_workspaces/ws_bi_semantic/semantic_models: "Contenedor base para *.SemanticModel en formato TMDL / PBISM (Direct Lake)."
  fabric_workspaces/ws_bi_semantic/reports: "Contenedor base para archivos Power BI y *.Report en formato PBIR / PBIP."
routing_rules:
  .Environment: fabric_workspaces/ws_core_governance/environments
  .whl: fabric_workspaces/ws_core_governance/libraries
  .Lakehouse: fabric_workspaces/ws_silver_transform/lakehouses
  .DataPipeline: fabric_workspaces/ws_bronze_ingest/pipelines
  .CopyJob: fabric_workspaces/ws_bronze_ingest/pipelines
  .Dataflow: fabric_workspaces/ws_bronze_ingest/dataflows
  .Eventstream: fabric_workspaces/ws_bronze_ingest/eventstreams
  .MirroredDatabase: fabric_workspaces/ws_bronze_ingest/eventstreams
  .KQLDatabase: fabric_workspaces/ws_bronze_ingest/eventstreams
  .Notebook: fabric_workspaces/ws_silver_transform/notebooks
  .ipynb: fabric_workspaces/ws_silver_transform/notebooks
  .Warehouse: fabric_workspaces/ws_gold_analytics/warehouses
  .SQLDatabase: fabric_workspaces/ws_gold_analytics/warehouses
  .sql: fabric_workspaces/ws_gold_analytics/warehouses
  .SemanticModel: fabric_workspaces/ws_bi_semantic/semantic_models
  .tmdl: fabric_workspaces/ws_bi_semantic/semantic_models
  .pbism: fabric_workspaces/ws_bi_semantic/semantic_models
  .Report: fabric_workspaces/ws_bi_semantic/reports
  .pbir: fabric_workspaces/ws_bi_semantic/reports
  .pbip: fabric_workspaces/ws_bi_semantic/reports
  .md: docs/notes
  .pdf: docs/specs
  .drawio: docs/architecture
  .png: docs/architecture
  .yaml: config
  .yml: config
  .json: schemas
  .avsc: schemas
